[project]
name = "spotting-at-risk-early"
version = "1.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.3",
  "PyMySQL==1.2.3",
  "python-multipart==0.0.32",
  "alembic==1.20.0",
  "python-dotenv==1.1.1",
  "PyJWT[crypto]==2.10.1",
  "psycopg[binary]>=3.2,<4",
  "reportlab==4.4.9"
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python tools/vercel_build.py"
